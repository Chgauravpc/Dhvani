<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3B-19 labels</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:46rem;margin:1.5rem auto;padding:0 1rem}
.card{border:1px solid #8886;border-radius:8px;padding:1rem 1.25rem}
.k{font-size:.8rem;text-transform:uppercase;opacity:.65;margin-top:.7rem}
.v{font-size:1.25rem;word-break:break-word}
button{font:inherit;padding:.5rem 1rem;margin:.25rem .25rem 0 0;cursor:pointer}
.on{outline:3px solid #2a7;font-weight:600}

#bar div{height:8px;background:#2a7;border-radius:4px}
textarea{width:100%;font:inherit}
</style></head><body>
<h2>3B-19: is the returned value equivalent to an accepted value?</h2>
<p><b>equivalent</b>: the returned value means the same as an accepted value (a
different script, language or surface form of the same thing counts).
<b>not_equivalent</b>: it does not. Keys: <b>E</b> / <b>N</b>, <b>&larr; &rarr;</b> to move.</p>
<div id="bar"><div></div></div><div id="count"></div>
<div class="card" id="card"></div>
<p><button id="e">E: equivalent</button><button id="n">N: not equivalent</button>
<button id="prev">&larr; prev</button><button id="next">next &rarr;</button></p>
<p>Note (optional)<br><textarea id="note" rows="2"></textarea></p>
<p><button id="dl">Download CSV</button> <span id="warn"></span></p>
<script>

_value": "\"दिल्ली\""}, {"item": "9", "language": "hindi", "user_query": "दिल्ली में दिवाली के दिन air quality कैसी थी?", "function": "air_quality", "parameter": "date", "accepted_values": "11-12-2024", "returned_value": "\"22-10-2023\""}, {"item": "10", "language": "hindi", "user_query": "दिल्ली में लाल किले की संरचना का विश्लेषण करें, मंज़िल 1 और 2 के लिए।", "function": "analyze_structure", "parameter": "building_id", "accepted_values": "Red Fort, Delhi", "returned_value": "\"red fort delhi\""}, {"item": "11", "language": "english", "user_query": "What are Neeraj Chopra's biggest wins?", "function": "sports_celebrity.get_major_achievements", "parameter": "team", "accepted_values": "all", "returned_value": "\"India\""}, {"item": "12", "language": "hindi", "user_query": "पुणे में पिछले ५ दिनों का air quality बताइए।", "function": "environmental_data.air_quality_index", "parameter": "location", "accepted_values": "Delhi", "returned_value": "\"पुणे\""}, {"item": "13", "language": "hindi", "user_query": "मनाली में अगले ५ दिनों का मौसम कैसा रहेगा?", "function": "weather_forecast_detailed", "parameter": "details", "accepted_values": "False", "returned_value": "true"}, {"item": "14", "language": "hindi", "user_query": "दिल्ली में राष्ट्रीय संग्रहालय के रविवार के खुलने का समय क्या है?", "function": "museum_working_hours.get", "parameter": "location", "accepted_values": "Delhi", "returned_value": "\"दिल्ली\""}, {"item": "15", "language": "hindi", "user_query": "दिल्ली में आज सुबह 9 बजे air quality कैसी है?", "function": "get_air_quality_index", "parameter": "time", "accepted_values": "9:00 AM", "returned_value": "\"2024-11-14T09:00:00Z\""}, {"item": "16", "language": "english", "user_query": "My desi cow has good milk yield, disease resistance, and heat tolerance. What's its overall fitness score?", "function": "calculate_fitness", "parameter": "trait_contributions", "accepted_values": "0.4 | 0.3 | 0.3", "returned_value": "[0.3333, 0.3333, 0.3334]"}, {"item": "17", "language": "hindi", "user_query": "वाराणसी में अच्छे ५ vegetarian रेस्टोरेंट दिखाओ", "function": "find_restaurants", "parameter": "location", "accepted_values": "Varanasi, Uttar Pradesh", "returned_value": "\"वाराणसी, वाराणसी\""}, {"item": "18", "language": "hindi", "user_query": "राम किंकर बैज की 'विषाद' मूर्तिकला के बारे में जानकारी चाहिए।", "function": "sculpture.get_details", "parameter": "title", "accepted_values": "Vishad", "returned_value": "\"विषाद\""}, {"item": "19", "language": "english", "user_query": "What are the ticket prices and opening hours for the Salar Jung Museum in Hyderabad on Republic Day, 2024?", "function": "museum_info", "parameter": "date", "accepted_values": "2024-01-26", "returned_value": "\"2024-12-01\""}, {"item": "20", "language": "hindi", "user_query": "मुझे दिवाली के लिए बेसन के लड्डू की रेसिपी चाहिए, जिसमें 10 लोगों के लिए पर्याप्त सामग्री हो।", "function": "recipe_search", "parameter": "ingredients", "accepted_values": "besan | sugar | ghee | cardamom | nuts", "returned_value": "[\"Besan (gram flour)\", \"Ghee\", \"Sugar\", \"Cardamom powder\", \"Dry fruits (almonds, pistachios, cashews)\", \"Saffron (optional)\", \"Water\", \"Coconut flakes (optional)\"]"}, {"item": "21", "language": "english", "user_query": "My desi cow has good milk yield, disease resistance, and heat tolerance. What's its overall fitness score?", "function": "calculate_fitness", "parameter": "trait_contributions", "accepted_values": "0.4 | 0.3 | 0.3", "returned_value": "[0.4, 0.35, 0.25]"}, {"item": "22", "language": "english", "user_query": "What's the air quality in Delhi on Diwali this year?", "function": "air_quality", "parameter": "date", "accepted_values": "11-01-2024", "returned_value": "\"2023-10-24\""}, {"item": "23", "language": "english", "user_query": "How much is 5000 Rupees in US Dollars today?", "function": "currency_converter", "parameter": "amount", "accepted_values": "5000.0", "returned_value": "5000"}, {"item": "24", "language": "english", "user_query": "What movies are playing in PVR Icon, Velachery for the next 7 days?", "function": "get_theater_movie_releases", "parameter": "location", "accepted_values": "Chennai", "returned_value": "\"PVR Icon, Velachery\""}, {"item": "25", "language": "hindi", "user_query": "गणेश चतुर्थी के लिए नारंगी और लाल रंग मिलाकर एक हल्का रंग चाहिए।", "function": "mix_paint_color", "parameter": "lightness", "accepted_values": "70", "returned_value": "50"}, {"item": "26", "language": "hindi", "user_query": "वाराणसी में पिछले छह महीनों में कितनी बारिश हुई?", "function": "ecology_data.precipitation_stats", "parameter": "location", "accepted_values": "Varanasi", "returned_value": "\"वाराणसी\""}, {"item": "27", "language": "english", "user_query": "Book a room at The Taj,Mumbai from 24th December to 26th December for Diwali.", "function": "hotel_booking", "parameter": "location", "accepted_values": "Mumbai, Maharashtra", "returned_value": "\"Mumbai\""}, {"item": "28", "language": "hindi", "user_query": "दिल्ली में अगले 10 दिनों में होने वाले शास्त्रीय संगीत कार्यक्रम बताइये।", "function": "event_finder.find_upcoming", "parameter": "location", "accepted_values": "Delhi, Delhi", "returned_value": "\"Delhi\""}, {"item": "29", "language": "english", "user_query": "I weigh 75 kg and work as a delivery guy in Delhi. How much water should I drink daily?", "function": "calculate_daily_water_intake", "parameter": "activity_level", "accepted_values": "high", "returned_value": "\"moderate\""}, {"item": "30", "language": "hindi", "user_query": "वाराणसी से गोरखपुर तक बस से जाने में कितना समय लगेगा?", "function": "city_distance.find_shortest", "parameter": "start_city", "accepted_values": "Varanasi", "returned_value": "\"वाराणसी\""}, {"item": "31", "language": "english", "user_query": "Book a room at The Taj,Mumbai from 24th December to 26th December for Diwali.", "function": "hotel_booking", "parameter": "end_date", "accepted_values": "2024-12-26", "returned_value": "\"2025-12-26\""}, {"item": "32", "language": "hindi", "user_query": "कोरमंगला में अगले ३ दिनों का तापमान और बारिश की संभावना बताइये।", "function": "detailed_weather_forecast", "parameter": "location", "accepted_values": "Koramangala", "returned_value": "\"कोरमंगला\""}, {"item": "33", "language": "hindi", "user_query": "मुझे swiggy पर दाल मखनी की कैलोरी बताइये।", "function": "recipe_info.get_calories", "parameter": "recipe", "accepted_values": "dal makhani", "returned_value": "\"दाल मखनी\""}, {"item": "34", "language": "hindi", "user_query": "दिल्ली वाले Walmart में २ किलो चीनी और ५ पैकेट बिस्किट का कुल दाम बताओ।", "function": "walmart.check_price", "parameter": "quantities", "accepted_values": "2 | 5", "returned_value": "[1, 1]"}, {"item": "35", "language": "hindi", "user_query": "दिल्ली वाले Walmart में २ किलो चीनी और ५ पैकेट बिस्किट का कुल दाम बताओ।", "function": "walmart.check_price", "parameter": "store_location", "accepted_values": "Delhi", "returned_value": "\"दिल्ली\""}, {"item": "36", "language": "english", "user_query": "What's the INR to Riyal rate with a 1.5% service charge?", "function": "get_exchange_rate_with_fee", "parameter": "target_currency", "accepted_values": "SAR", "returned_value": "\"Riyal\""}, {"item": "37", "language": "hindi", "user_query": "सूर्यकुमार यादव के २०२० में टी२० मैचों में कितने रन बने और कितने गेंदें खेलीं? औसत निकालो।", "function": "calculate_batting_average", "parameter": "at_bats", "accepted_values": "44", "returned_value": "0"}, {"item": "38", "language": "hindi", "user_query": "मुझे दिवाली के लिए बेसन के लड्डू की रेसिपी चाहिए, जिसमें 10 लोगों के लिए पर्याप्त सामग्री हो।", "function": "recipe_search", "parameter": "ingredients", "accepted_values": "besan | sugar | ghee | cardamom | nuts", "returned_value": "[\"besan\", \"ghee\", \"sugar\", \"cardamom\"]"}, {"item": "39", "language": "english", "user_query": "How much Asian Paints Royale paint do I need for a 12feet x 10feet wall in my new flat in Gurgaon?", "function": "calculate_paint_needed", "parameter": "height", "accepted_values": "10", "returned_value": "12"}, {"item": "40", "language": "hindi", "user_query": "मुंबई में एक rental agreement बनाने के लिए, मालिक और किरायेदार के बीच, क्या कर सकते हैं?", "function": "generate_law_contract", "parameter": "parties", "accepted_values": "Landlord | Tenant", "returned_value": "[\"Owner\", \"Tenant\"]"}, {"item": "41", "language": "english", "user_query": "Need a quick veg recipe, under 30 minutes, for a Diwali snack?", "function": "find_recipe", "parameter": "dietary_restrictions", "accepted_values": "vegetarian", "returned_value": "\"vegan\""}, {"item": "42", "language": "hindi", "user_query": "पिछले 30 दिनों में निफ्टी 50 और बैंक निफ्टी का प्रदर्शन कैसा रहा?", "function": "market_performance.get_data", "parameter": "detailed", "accepted_values": "False", "returned_value": "true"}, {"item": "43", "language": "english", "user_query": "What's the air quality in Delhi today? Need to know if I should skip my morning walk.", "function": "get_air_quality", "parameter": "detail", "accepted_values": "False", "returned_value": "true"}, {"item": "44", "language": "english", "user_query": "What's the rate for 5000 Rupees to Dirham right now?", "function": "latest_exchange_rate", "parameter": "amount", "accepted_values": "5000.0", "returned_value": "5000"}, {"item": "45", "language": "english", "user_query": "Any good rock concerts happening in Bangalore around Diwali?", "function": "concert_info.get", "parameter": "date", "accepted_values": "around Diwali", "returned_value": "\"2023-10-25\""}, {"item": "46", "language": "english", "user_query": "My desi cow has good milk yield, disease resistance, and heat tolerance. What's its overall fitness score?", "function": "calculate_fitness", "parameter": "trait_values", "accepted_values": "0.8 | 0.75 | 0.9", "returned_value": "[0.8, 0.9, 0.85]"}, {"item": "47", "language": "english", "user_query": "I want a quick vegan soup recipe, something I can make in under 30 minutes, and preferably with tomatoes.", "function": "get_vegan_recipe", "parameter": "ingredient_preference", "accepted_values": "tomatoes", "returned_value": "[\"tomato\"]"}, {"item": "48", "language": "hindi", "user_query": "वाराणसी, उत्तर प्रदेश में पिछले साल चोरी की दर क्या थी?", "function": "get_crime_rate", "parameter": "year", "accepted_values": "2023", "returned_value": "2022"}, {"item": "49", "language": "hindi", "user_query": "एक स्कूटर दिल्ली से जयपुर की दूरी 300 मीटर की दूरी तय करता है, जिसकी गति 2 meter per second square है। अंतिम वेग क्या होगा?", "function": "kinematics.final_velocity_from_distance", "parameter": "initial_velocity", "accepted_values": "0.0", "returned_value": "0"}, {"item": "50", "language": "english", "user_query": "What's the average temperature in Pune for the next 7 days?", "function": "average_temperature", "parameter": "temp_unit", "accepted_values": "Fahrenheit", "returned_value": "\"Celsius\""}];
const KEY = "dhvani-3b19-labels";
let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let i = 0;
for (let j = 0; j < ROWS.length; j++) if (!(st[ROWS[j].item] || {}).label) { i = j; break; }
const $ = (id) => document.getElementById(id);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
function esc(s) { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function show() {
  const r = ROWS[i], s = st[r.item] || {};
  $("card").innerHTML =
    `<div class="k">item ${r.item} of ${ROWS.length} &middot; ${r.language}</div>` +
    `<div class="k">user query</div><div class="v">${esc(r.user_query)}</div>` +
    `<div class="k">function &middot; parameter</div><div class="v">${esc(r.function)} &middot; <b>${esc(r.parameter)}</b></div>` +
    `<div class="k">accepted value(s)</div><div class="v">${esc(r.accepted_values)}</div>` +
    `<div class="k">model returned</div><div class="v">${esc(r.returned_value)}</div>`;
  $("e").className = s.label === "equivalent" ? "on" : "";
  $("n").className = s.label === "not_equivalent" ? "on" : "";
  $("note").value = s.note || "";
  const done = ROWS.filter(x => (st[x.item] || {}).label).length;
  $("count").textContent = `${done} / ${ROWS.length} labelled`;
  $("bar").firstChild.style.width = (100 * done / ROWS.length) + "%";
}
function set(label) {
  const r = ROWS[i]; st[r.item] = Object.assign(st[r.item] || {}, {label});
  save(); if (i < ROWS.length - 1) i++; show();
}
const go = (d) => { i = Math.max(0, Math.min(ROWS.length - 1, i + d)); show(); };
$("e").onclick = () => set("equivalent"); $("n").onclick = () => set("not_equivalent");
$("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
$("note").oninput = (ev) => { const r = ROWS[i]; st[r.item] = Object.assign(st[r.item] || {}, {note: ev.target.value}); save(); };
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "TEXTAREA") return;
  const k = ev.key.toLowerCase();
  if (k === "e") set("equivalent"); else if (k === "n") set("not_equivalent");
  else if (k === "arrowleft") go(-1); else if (k === "arrowright" || k === "enter") go(1);
});
const q = (s) => '"' + String(s).replace(/"/g, '""') + '"';
$("dl").onclick = () => {
  const missing = ROWS.filter(r => !(st[r.item] || {}).label).length;
  $("warn").textContent = missing ? `${missing} still unlabelled` : "";
  const head = "item,language,user_query,function,parameter,accepted_values,returned_value,label (equivalent / not_equivalent),note";
  const lines = ROWS.map(r => [r.item, r.language, q(r.user_query), q(r.function), q(r.parameter),
    q(r.accepted_values), q(r.returned_value), (st[r.item] || {}).label || "", q((st[r.item] || {}).note || "")].join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([head + "\n" + lines.join("\n") + "\n"], {type: "text/csv"}));
  a.download = "f1_judge_labels_owner.csv"; a.click();
};
show();
</script></body></html>
