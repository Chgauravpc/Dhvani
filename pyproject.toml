[project]
name = "dhvani"
version = "0.1.0"
description = "Indic voice-agent instrumentation, providers, and pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "aiortc>=1.15.0",
    "faster-whisper>=1.2.1",
    "groq>=1.7.0",
    "huggingface-hub>=1.32.0",
    "indic-transliteration>=2.3.82",
    "onnxruntime>=1.30.0",
    "piper-tts>=1.8.0",
    "pyarrow>=19.0.0",
    "rapidfuzz>=3.14.0",
    "silero-vad-notorch>=6.2.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhvani"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "integration: requires a real model download and/or network access (API key); skipped by default",
    "real_time_loop: needs the platform's real event loop, not VirtualTimeLoop (genuine socket I/O)",
]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["silero_vad_notorch.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
